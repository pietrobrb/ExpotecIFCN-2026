{% extends 'public/layout.html' %}
{% load static i18n %}
{% block title %} Área Temática {% endblock title %}
{% block bodyclass %}bg-black single-page{% endblock bodyclass %}

{% block content %}

<section class="section bg-white">
    <div class="container">
        <div class="row  my-3">
                <div class="col-md-12">
                    <h3 class="section-title">
                        <span class='small'>ÁREA TEMÁTICA</span><br>
                        {{ object.nome }}
                    </h3>
                   
                </div>
                <div class="col-md-12"></div>
                    <div class="text-justify">{{object.descricao | safe}}</div>
                </div>
                </div><!-- /.col-sm-6 -->
            </div><!-- /.row -->
       
        </div>
    </div>
</section>
{% endblock content %}
