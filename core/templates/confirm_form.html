{% extends "modal.html" %}
{% load i18n %}
{% block modalcontent %}
  <form class="form"
        method="post"
        id="submit-modal-form"
        action="{{ request.path }}">
    {% csrf_token %}
    
      <div class="modal-header">
      <div class="modal-title fw-bold">{{ page_title }}</div>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
      </button>
    
    </div>
    <div class="modal-body">
      <p>{{ confirm_message|safe }}</p>
    </div>
    <div class="modal-footer">
      
      <button type="button" class="btn btn-outline-primary" data-dismiss="modal">Cancelar</button>
      <button type="submit" class="btn btn-primary ms-2">Sim</button>
    </div>
  </form>
{% endblock modalcontent %}
{% block preloader %}
{% endblock preloader %}
