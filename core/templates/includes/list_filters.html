<div class="expotec-filtros-grid">
  {% for field in filterset.form %}
  <div class="expotec-filtro-campo">
    {{ field.label_tag }}
    {{ field }}
    {% if field.errors %}
    <div class="text-danger small">
      {{ field.errors }}
    </div>
    {% endif %}
  </div>
  {% endfor %}

  <div class="expotec-filtro-botao">
    <button type="submit" class="btn btn-primary">Filtrar</button>
  </div>
</div>
